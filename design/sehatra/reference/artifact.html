<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sehatra MCU</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: sidebar + sticky topbar + content; cards only for data blocks, calm teal on cool-green neutrals */
:root{
  --bg:#F3F7F5; --surface:#FFFFFF; --surface-2:#EAF0EE; --line:#DFE7E4; --line-2:#CBD7D3;
  --fg:#13231F; --muted:#586B65; --faint:#8A9C96;
  --accent:#0E8A7A; --accent-ink:#FFFFFF; --accent-soft:#DFF2EE; --accent-strong:#0A6B5E;
  --good:#1B8A52; --good-bg:#E0F4E9; --info:#2F6FCB; --info-bg:#E4EEFB;
  --warn:#A8650A; --warn-bg:#FBEDD3; --crit:#C93A3A; --crit-bg:#FBE4E3;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:12px; --gx:28px;
  --shadow:0 1px 2px rgba(16,40,34,.05),0 4px 14px rgba(16,40,34,.04);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1614; --surface:#14211E; --surface-2:#1A2A27; --line:#233632; --line-2:#2F4540;
  --fg:#E6EFEC; --muted:#9BB0A9; --faint:#6F847D;
  --accent:#3DC8B3; --accent-ink:#06211D; --accent-soft:#163732; --accent-strong:#7FE0D1;
  --good:#52C586; --good-bg:#16352A; --info:#78A9F0; --info-bg:#1A2B47;
  --warn:#E5AC4F; --warn-bg:#3B2D12; --crit:#F08585; --crit-bg:#3E1D1D;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1614; --surface:#14211E; --surface-2:#1A2A27; --line:#233632; --line-2:#2F4540;
  --fg:#E6EFEC; --muted:#9BB0A9; --faint:#6F847D;
  --accent:#3DC8B3; --accent-ink:#06211D; --accent-soft:#163732; --accent-strong:#7FE0D1;
  --good:#52C586; --good-bg:#16352A; --info:#78A9F0; --info-bg:#1A2B47;
  --warn:#E5AC4F; --warn-bg:#3B2D12; --crit:#F08585; --crit-bg:#3E1D1D;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;align-self:start;display:flex;flex-direction:column;gap:22px;padding:20px 16px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-right:1px solid var(--line);z-index:50}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand b{font-size:17px;font-weight:800;letter-spacing:-.02em;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:0 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:600}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-strong)}
.nav a .cnt{margin-left:auto;font-size:11.5px;background:var(--surface-2);color:var(--muted);border-radius:99px;padding:1px 8px;font-weight:700}
.nav a[aria-current="page"] .cnt{background:var(--surface);color:var(--accent-strong)}
.cycle{margin-top:auto;border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--bg);display:flex;flex-direction:column;gap:9px}
.cycle .t{font-size:12px;color:var(--muted);font-weight:600}
.cycle .v{font-size:22px;font-weight:800;letter-spacing:-.02em}
.bar{height:7px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:9px}
.cycle .s{font-size:12px;color:var(--muted)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px;padding-left:max(var(--gx),env(safe-area-inset-left,0px));padding-right:max(var(--gx),env(safe-area-inset-right,0px))}
.search{flex:1;max-width:440px;display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:40px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;height:100%}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{color:var(--fg);border-color:var(--line-2)}
.menu-btn{display:none}
.me{display:flex;align-items:center;gap:10px;margin-left:auto;padding-left:6px}
.me .who{line-height:1.25;text-align:right}
.me .who b{display:block;font-weight:700;font-size:13px}
.me .who span{font-size:12px;color:var(--muted)}
.ava{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent-strong);display:grid;place-items:center;font-weight:800;font-size:12.5px;flex:none}

.content{padding-block:8px 48px;padding-left:max(var(--gx),env(safe-area-inset-left,0px));padding-right:max(var(--gx),env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;max-width:1280px;width:100%}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph h1{font-size:24px;font-weight:800;letter-spacing:-.025em;text-wrap:balance}
.ph p{color:var(--muted);margin-top:2px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 15px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{height:30px;padding:0 11px;font-size:12.5px;border-radius:8px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 0}
.card-h h2{font-size:15px;font-weight:700;letter-spacing:-.01em}
.card-h span{font-size:12px;color:var(--muted)}
.card-b{padding:14px 18px 18px}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g-3{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.kpi .l i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.kpi .v{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.kpi .v small{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:4px}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi .bar{margin-top:4px}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 10px 2px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p0{background:var(--good-bg);color:var(--good)}
.p1{background:var(--info-bg);color:var(--info)}
.p2{background:var(--warn-bg);color:var(--warn)}
.p3{background:var(--crit-bg);color:var(--crit)}
.pm{background:var(--surface-2);color:var(--muted)}
.tag{display:inline-block;background:var(--surface-2);color:var(--muted);border-radius:6px;padding:1px 8px;font-size:12px;font-weight:600}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
svg text{font-family:var(--font);fill:var(--muted);font-size:11px}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
.donut-leg{display:flex;flex-direction:column;gap:9px;font-size:13px;min-width:150px}
.donut-leg div{display:flex;align-items:center;gap:8px}
.donut-leg i{width:10px;height:10px;border-radius:3px;flex:none}
.donut-leg b{margin-left:auto;padding-left:10px}

.hb{display:flex;flex-direction:column;gap:13px}
.hb-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;font-size:13px}
.hb-row .track{grid-column:1/-1;height:8px;background:var(--surface-2);border-radius:9px;overflow:hidden}
.hb-row .track i{display:block;height:100%;border-radius:9px;background:var(--accent)}
.hb-row b{font-weight:700}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-inline:0;border-top:0;text-align:left}
.li:last-child{border-bottom:0;padding-bottom:0}
.li:first-child{padding-top:0}
button.li:hover .nm{color:var(--accent-strong)}
.li .tx{flex:1;min-width:0}
.li .nm{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datebox{width:44px;text-align:center;border-radius:9px;background:var(--accent-soft);color:var(--accent-strong);padding:4px 0;flex:none;line-height:1.15}
.datebox b{display:block;font-size:16px;font-weight:800}
.datebox span{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}

.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{height:38px;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:0 12px;min-width:0}
.field:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tools .search{max-width:320px;flex:1 1 220px;height:38px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:8px;padding:6px 13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.seg button span{color:var(--faint);margin-left:5px;font-weight:700}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th{text-align:left;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.row{cursor:pointer}
tbody tr.row:hover td{background:var(--bg)}
.who-c{display:flex;align-items:center;gap:12px}
.who-c b{display:block;font-weight:650;line-height:1.25}
.who-c span{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;flex-wrap:wrap}
.pager div{display:flex;gap:6px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}

.heat{display:grid;gap:3px;font-size:12.5px;min-width:620px}
.heat>div{padding:8px 6px;text-align:center;border-radius:6px}
.heat .hh{font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;padding:0 4px 4px}
.heat .rl{text-align:left;font-weight:600;padding-left:0}
.stack{display:flex;height:22px;border-radius:7px;overflow:hidden;gap:2px;background:var(--surface-2)}
.stack i{display:block;height:100%}
.stack-row{display:grid;grid-template-columns:150px minmax(0,1fr) 40px;gap:12px;align-items:center;font-size:13px;margin-bottom:12px}
.stack-row span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.stack-row span:last-child{text-align:right;color:var(--muted)}
.trend{border:1px solid var(--line);border-radius:10px;padding:10px 8px 4px;overflow:hidden}
.insights{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.insight{background:var(--accent-soft);border-radius:var(--r);padding:14px 16px;color:var(--fg)}
.insight b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-strong);margin-bottom:4px}

.scrim{position:fixed;inset:0;background:rgba(8,20,17,.5);z-index:80;display:flex;justify-content:flex-end;animation:fade .18s ease}
.scrim.center{justify-content:center;align-items:center;padding:16px}
.panel{background:var(--surface);width:min(500px,100%);height:100%;overflow-y:auto;display:flex;flex-direction:column;animation:slide .22s ease;padding-bottom:env(safe-area-inset-bottom,0px);padding-top:env(safe-area-inset-top,0px)}
.scrim.center .panel{height:auto;max-height:100%;border-radius:16px;width:min(560px,100%);animation:pop .18s ease}
.panel-h{display:flex;align-items:flex-start;gap:14px;padding:20px 22px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:18px;font-weight:800;letter-spacing:-.02em}
.panel-h p{color:var(--muted);font-size:13px}
.panel-h .icon-btn{margin-left:auto;width:34px;height:34px}
.panel-b{padding:18px 22px;display:flex;flex-direction:column;gap:20px;flex:1}
.panel-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line)}
.sec-t{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin-bottom:10px}
.vit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.vit div{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.vit span{font-size:12px;color:var(--muted);display:block}
.vit b{font-size:17px;font-weight:800;letter-spacing:-.01em}
.vit small{font-size:11.5px;color:var(--faint);display:block}
.vit .bad{border-color:var(--crit);background:var(--crit-bg)}
.vit .bad b{color:var(--crit)}
.note{border-radius:10px;background:var(--surface-2);padding:12px 14px;color:var(--fg)}
.note ul{margin:6px 0 0;padding-left:18px;color:var(--muted)}
.dl{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 12px;font-size:13.5px}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-weight:600}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
.form label.full{grid-column:1/-1}
.form .field{width:100%;color:var(--fg);font-weight:500}
.live{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:10px;background:var(--surface-2);padding:12px 14px;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px);animation:pop .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:1000px){.g-2-1{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  :root{--gx:16px}
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:272px;max-width:86vw;height:auto;transform:translateX(-102%);transition:transform .22s ease;padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .menu-btn{display:grid}
  .me .who{display:none}
  .stack-row{grid-template-columns:100px minmax(0,1fr) 36px;gap:8px}
}
@media (max-width:520px){
  .vit{grid-template-columns:1fr 1fr}
  .form{grid-template-columns:1fr}
  .dl{grid-template-columns:100px minmax(0,1fr)}
  .ph h1{font-size:21px}
  .kpi .v{font-size:26px}
}
</style>

<div class="app">
  <aside class="side" id="side" aria-label="Navigasi utama">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.4-7-10.2V5.6L12 3l7 2.6v5.2C19 16.6 12 21 12 21Z"/><path d="M12 8.5v5M9.5 11h5"/></svg></div>
      <div><b>Sehatra</b><small>Manajemen MCU</small></div>

      <div class="t">Cakupan MCU 2026</div>

        <input id="gsearch" type="search" placeholder="Cari nama atau NIK karyawan" autocomplete="off">
      </label>
      <button class="icon-btn" id="themeBtn" aria-label="Ganti tema"></button>

<script>
/* ---------- util ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TODAY=new Date(2026,10,20), YEARS=[2023,2024,2025,2026];
const fmt=d=>d.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
const MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const pct=(a,b)=>b?Math.round(a/b*100):0;

/* ---------- perhitungan ---------- */
function findingsOf(v,male){
  const f=[];
  if(v.sis>=140||v.dia>=90)f.push('ht');
  if(v.bmi>=27)f.push('ob');
  if(v.gdp>=126)f.push('dm');
  if(v.kol>=240)f.push('kol');
  if(v.au>(male?7:6))f.push('au');
  if(v.sgpt>55)f.push('hati');
  if(v.visus==='Miopi sedang')f.push('mata');
  return f;
}
function catOf(v,male){
  const n=findingsOf(v,male).length;
  if(v.sis>=180||v.gdp>=200||n>=3)return 3;
  return n===0?0:n===1?1:2;
}
/* Jakarta Cardiovascular Score: 7 item, total -7 s.d. 18 */
function jcsOf(v,age,male){
  const b=(x,a)=>x<a[0]?0:x<a[1]?1:x<a[2]?2:x<a[3]?3:4;
  const bp=Math.max(b(v.sis,[130,140,160,180]),b(v.dia,[85,90,100,110]));
  const parts=[
   {k:'Jenis kelamin',val:male?'Laki-laki':'Perempuan',p:male?1:0},
   {k:'Usia',val:age+' tahun',p:age<35?-4:age<40?-3:age<45?-2:age<50?0:age<55?1:age<60?2:age<65?3:4},
   {k:'Tekanan darah',val:v.sis+'/'+v.dia+' mmHg',p:bp},
   {k:'Indeks massa tubuh',val:v.bmi+' kg/m²',p:v.bmi<=25?0:v.bmi<30?1:2},
   {k:'Merokok',val:MEROKOK[v.merokok],p:{Tidak:0,Bekas:3,Ya:4}[v.merokok]},
   {k:'Diabetes mellitus',val:v.gdp>=126?'Ya (GDP '+v.gdp+')':'Tidak',p:v.gdp>=126?2:0},
   {k:'Aktivitas fisik',val:v.aktivitas,p:{Berat:-3,Sedang:0,Ringan:1}[v.aktivitas]}];
  const total=parts.reduce((a,x)=>a+x.p,0);
  return{parts,total,level:total<=1?0:total<=4?1:2};
}

const R=rng(2026), rn=(a,b)=>a+R()*(b-a), EMP=[], MCUS=[];
function addRec(e,date,jenis,v,age){
  const r={emp:e.id,date,year:date.getFullYear(),jenis,age,v,klinik:['Klinik On-site Pabrik','Klinik Mitra Sehat','RS Bina Waluyo'][Math.floor(R()*3)]};
  r.cat=catOf(v,e.male);r.jcs=jcsOf(v,age,e.male);MCUS.push(r);
}
for(let i=0;i<72;i++){
  const male=R()<.58,d=POOL[Math.floor(R()*POOL.length)],age=22+Math.floor(R()*37);
  const sis=Math.round(105+R()*26+(age-22)*.45+(R()<.07?28:0));
  const base={sis,dia:Math.round(68+R()*14+(age-22)*.2+(sis>=140?9:0)),bmi:+(19+R()*8+(age>40?1.2:0)+(R()<.12?3:0)).toFixed(1),gdp:Math.round(82+R()*26+(age>40?6:0)+(R()<.09?45:0)),kol:Math.round(150+R()*80+(age-22)*.8),au:+(3.4+R()*2.8+(male?1.1:0)).toFixed(1),sgpt:Math.round(18+R()*28+(R()<.07?45:0)),visus:R()<.09?'Miopi sedang':R()<.3?'Miopi ringan':'Normal'};
  const smoke0=male?(R()<.36?'Ya':R()<.12?'Bekas':'Tidak'):(R()<.04?'Ya':'Tidak');
  const act0=['Ringan','Ringan','Sedang','Sedang','Berat'][Math.floor(R()*5)];
  const e={id:'KRY-'+(1001+i),name:(male?FM:FF)[Math.floor(R()*12)]+' '+LAST[Math.floor(R()*LAST.length)],male,age,dept:DEPTS[d],jab:JAB[d][Math.floor(R()*3)],recs:[]};
  EMP.push(e);
  YEARS.forEach(y=>{
    const back=2026-y;if(age-back<20||R()>(y===2026?.78:.92))return;
    const m=Math.floor(R()*(y===2026?11:12)),day=1+Math.floor(R()*(y===2026&&m===10?18:27));
    const v={sis:Math.round(base.sis-back*1.6+rn(-4,4)),dia:Math.round(base.dia-back*.7+rn(-3,3)),bmi:+(base.bmi-back*.3+rn(-.4,.4)).toFixed(1),gdp:Math.round(base.gdp-back*2.5+rn(-4,4)),kol:Math.round(base.kol-back*3+rn(-8,8)),au:+(base.au-back*.1+rn(-.2,.2)).toFixed(1),sgpt:Math.round(base.sgpt+rn(-4,4)),visus:base.visus,merokok:back>0&&smoke0==='Bekas'?'Ya':smoke0,aktivitas:R()<.12?['Ringan','Sedang','Berat'][Math.floor(R()*3)]:act0};
    addRec(e,new Date(y,m,day),'Berkala',v,age-back);
    if(findingsOf(v,male).length&&R()<.3){
      const dt=new Date(y,m,day+30+Math.floor(R()*60));
      if(dt<=TODAY)addRec(e,dt,'Tindak lanjut',{...v,sis:v.sis-6,dia:v.dia-3,gdp:v.gdp-8,kol:v.kol-15,bmi:+(v.bmi-.3).toFixed(1)},age-back);
    }
  });
}

function snap(y){const m=new Map();MCUS.forEach(r=>{if(r.year!==y)return;const o=m.get(r.emp);if(!o)m.set(r.emp,{e:EM[r.emp],r,n:1});else{o.n++;if(r.date>o.r.date)o.r=r}});return[...m.values()]}

function barChart(y){
  const ber=Array(12).fill(0),tl=Array(12).fill(0);
  MCUS.forEach(r=>{if(r.year===y)(r.jenis==='Tindak lanjut'?tl:ber)[r.date.getMonth()]++});
  const W=640,H=250,l=30,r=6,t=16,b=26,mx=Math.max(4,...ber.map((x,i)=>x+tl[i]));
  const top=Math.ceil(mx/2)*2,pw=(W-l-r)/12,bw=pw*.56,Y=v=>t+(H-t-b)*(1-v/top);let g='',bars='';
  for(let k=0;k<=4;k++){const v=top/4*k;g+=`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${l-6}" y="${Y(v)+4}" text-anchor="end">${v%1?v.toFixed(1):v}</text>`}
  for(let i=0;i<12;i++){
    const x=l+pw*i+(pw-bw)/2;
    if(ber[i])bars+=`<rect x="${x}" y="${Y(ber[i])}" width="${bw}" height="${Y(0)-Y(ber[i])}" rx="3" fill="var(--accent)"/>`;
    if(tl[i])bars+=`<rect x="${x}" y="${Y(ber[i]+tl[i])}" width="${bw}" height="${Y(ber[i])-Y(ber[i]+tl[i])-1}" rx="3" fill="var(--info)"/>`;
    if(ber[i]+tl[i])bars+=`<text x="${x+bw/2}" y="${Y(ber[i]+tl[i])-5}" text-anchor="middle" style="fill:var(--fg);font-weight:700">${ber[i]+tl[i]}</text>`;
    bars+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${MON[i]}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Jumlah pemeriksaan MCU per bulan ${y}">${g}${bars}</svg>`;
}
function donut(counts,labels,cols,center){
  const tot=counts.reduce((a,b)=>a+b,0),R0=62,C=2*Math.PI*R0;let off=0,segs='';
  counts.forEach((c,i)=>{const len=tot?C*c/tot:0;segs+=`<circle cx="80" cy="80" r="${R0}" fill="none" stroke="${cols[i]}" stroke-width="20" stroke-dasharray="${Math.max(0,len-(c&&c<tot?2:0))} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"/>`;off+=len});
  return `<div class="donut-wrap"><svg viewBox="0 0 160 160" width="150" height="150" role="img" aria-label="${center}"><circle cx="80" cy="80" r="${R0}" fill="none" stroke="var(--surface-2)" stroke-width="20"/>${segs}<text x="80" y="82" text-anchor="middle" style="font-size:28px;font-weight:800;fill:var(--fg)">${tot}</text><text x="80" y="100" text-anchor="middle">${center}</text></svg>
  <div class="donut-leg">${labels.map((c,i)=>`<div><i style="background:${cols[i]}"></i>${c}<b class="num">${counts[i]} <span class="muted" style="font-weight:500">· ${pct(counts[i],tot)}%</span></b></div>`).join('')}</div></div>`;
}
const hbars=(rows,max)=>`<div class="hb">${rows.map(r=>`<div class="hb-row"><span>${r[0]}</span><b class="num">${r[1]}%</b><div class="track"><i style="width:${Math.min(100,r[1]/max*100)}%"></i></div></div>`).join('')}</div>`;
function prevalence(list){return Object.keys(FIND).map(k=>[k,pct(list.filter(x=>findingsOf(x.r.v,x.e.male).includes(k)).length,list.length)])}
function lineChart(pts,series){
  const W=480,H=220,l=34,r=14,t=16,b=28,top=Math.max(10,Math.ceil(Math.max(...pts.flatMap(p=>series.map(s=>p[s.k])))/10)*10);
  const X=i=>l+(W-l-r)*(pts.length===1?.5:i/(pts.length-1)),Y=v=>t+(H-t-b)*(1-v/top);let g='';
  for(let k=0;k<=4;k++){const v=top/4*k;g+=`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${l-6}" y="${Y(v)+4}" text-anchor="end">${Math.round(v)}%</text>`}
  g+=pts.map((p,i)=>`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${p.y}</text>`).join('');
  series.forEach(s=>{
    g+=`<polyline fill="none" stroke="${s.c}" stroke-width="2.5" stroke-linejoin="round" points="${pts.map((p,i)=>X(i)+','+Y(p[s.k])).join(' ')}"/>`;
    g+=pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p[s.k])}" r="4" fill="${s.c}" stroke="var(--surface)" stroke-width="2"/><text x="${X(i)}" y="${Y(p[s.k])-9}" text-anchor="middle" style="fill:var(--fg);font-weight:700">${p[s.k]}%</text>`).join('');
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Tren per tahun">${g}</svg>`;
}
function scoreTrend(recs){
  const a=[...recs].sort((x,y)=>x.date-y.date),W=440,H=140,l=28,r=16,t=14,b=26;
  const lo=Math.min(-1,...a.map(x=>x.jcs.total))-1,hi=Math.max(6,...a.map(x=>x.jcs.total))+1,Y=v=>t+(H-t-b)*(1-(v-lo)/(hi-lo));
  const X=i=>l+(W-l-r)*(a.length===1?.5:i/(a.length-1));
  let s=`<rect x="${l}" y="${Y(1.5)}" width="${W-l-r}" height="${Y(lo)-Y(1.5)}" fill="var(--good-bg)"/><rect x="${l}" y="${Y(4.5)}" width="${W-l-r}" height="${Y(1.5)-Y(4.5)}" fill="var(--warn-bg)"/><rect x="${l}" y="${Y(hi)}" width="${W-l-r}" height="${Y(4.5)-Y(hi)}" fill="var(--crit-bg)"/>`;
  s+=`<polyline fill="none" stroke="var(--fg)" stroke-width="2" points="${a.map((x,i)=>X(i)+','+Y(x.jcs.total)).join(' ')}"/>`;
  s+=a.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.jcs.total)}" r="4.5" fill="${LVCOL[x.jcs.level]}" stroke="var(--surface)" stroke-width="2"/><text x="${X(i)}" y="${Y(x.jcs.total)-9}" text-anchor="middle" style="fill:var(--fg);font-weight:700">${x.jcs.total}</text><text x="${X(i)}" y="${H-8}" text-anchor="middle">${MON[x.date.getMonth()]} ${String(x.year).slice(2)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Tren skor Jakarta">${s}</svg>`;
}

function pager(total,PS){const pages=Math.max(1,Math.ceil(total/PS));S.page=Math.min(S.page,pages);return`<div class="pager"><span>Menampilkan ${total?(S.page-1)*PS+1:0}–${Math.min(total,S.page*PS)} dari ${total}</span><div><button class="btn sm" data-pg="-1" ${S.page<=1?'disabled':''}>Sebelumnya</button><button class="btn sm" data-pg="1" ${S.page>=pages?'disabled':''}>Berikutnya</button></div></div>`}
function paintEmp(){
  const q=S.q.trim().toLowerCase(),PS=10;
  const L=EMP.filter(e=>{const l=e.recs[0];
    return(!q||(e.name+e.id+e.jab).toLowerCase().includes(q))&&(!S.dept||e.dept===S.dept)&&
    (!S.st||(S.st[0]==='c'?(l&&l.cat===+S.st[1]):S.st==='tinggi'?(l&&l.jcs.level===2):!e.recs.some(r=>r.year===2026)))});
  const rows=L.slice((S.page-1)*PS,S.page*PS);

  ${rows.map(e=>{const l=e.recs[0];return`<tr class="row" tabindex="0" data-emp="${e.id}"><td><div class="who-c"><div class="ava">${initials(e.name)}</div><div><b>${esc(e.name)}</b><span class="num">${e.id} · ${e.jab}</span></div></div></td><td>${e.dept}</td><td class="num">${e.age} th</td><td><span class="tag num">${e.recs.length}×</span></td><td class="num">${l?fmt(l.date):'<span class="muted">–</span>'}</td><td>${l?catPill(l):nonePill}</td><td>${l?jcsPill(l):''}</td></tr>`}).join('')}</tbody></table></div>${pager(L.length,PS)}`
  :`<div class="empty"><b>Tidak ada karyawan yang cocok</b><p>Ubah kata kunci atau hapus filter.</p></div>`;
}

VIEWS.laporan=()=>`
  <div class="ph"><div><h1>Laporan & Analisis</h1><p>Ringkasan temuan dan risiko kardiovaskular dari MCU terbaru tiap karyawan</p></div>
    <div class="acts"><button class="btn" data-act="export">${svgi('dl',16)}Ekspor Excel</button><button class="btn pri" data-act="export">${svgi('dl',16)}Ekspor PDF</button></div></div>
  <div class="tools">
    <select id="ry" class="field" data-f="ry" aria-label="Tahun">${YEARS.map(v=>`<option ${S.ry===v?'selected':''}>${v}</option>`).join('')}</select>
    <select id="rd" class="field" data-f="rd" aria-label="Departemen"><option value="">Semua departemen</option>${DEPTS.map(d=>`<option ${S.rd===d?'selected':''}>${d}</option>`).join('')}</select>
    <select id="rg" class="field" data-f="rg" aria-label="Jenis kelamin"><option value="">Semua jenis kelamin</option><option value="L" ${S.rg==='L'?'selected':''}>Laki-laki</option><option value="P" ${S.rg==='P'?'selected':''}>Perempuan</option></select></div>
  <div id="rep" style="display:contents"></div>`;
function stackRows(sn,ds,key,labels,cols){
  return `<div class="legend" style="margin-bottom:14px">${labels.map((c,i)=>`<span><i style="background:${cols[i]}"></i>${c}</span>`).join('')}</div>`+
  ds.map(d=>{const g=sn.filter(x=>x.e.dept===d),n=labels.map(()=>0);g.forEach(x=>n[key(x)]++);return`<div class="stack-row"><span title="${d}">${d}</span><div class="stack" role="img" aria-label="${d}: ${n.join(', ')}">${n.map((c,i)=>c?`<i style="width:${c/g.length*100}%;background:${cols[i]}" title="${labels[i]}: ${c}"></i>`:'').join('')}</div><span class="num">n=${g.length}</span></div>`}).join('');
}
function paintRep(){
  const flt=x=>(!S.rd||x.e.dept===S.rd)&&(!S.rg||(S.rg==='L')===x.e.male);
  const L=snap(S.ry).filter(flt);
  if(!L.length){$('#rep').innerHTML='<div class="card empty">Belum ada hasil MCU untuk filter ini.</div>';return}
  const prv=prevalence(L),ds=DEPTS.filter(d=>L.some(x=>x.e.dept===d));
  const topF=[...prv].sort((a,b)=>b[1]-a[1])[0];
  const dRate=ds.map(d=>{const g=L.filter(x=>x.e.dept===d);return[d,g.length,pct(g.filter(x=>x.r.jcs.level===2).length,g.length)]}).filter(x=>x[1]>=3).sort((a,b)=>b[2]-a[2])[0];
  const multi=L.filter(x=>x.n>1).length;
  const fac=[['Hipertensi (≥140/90)',x=>x.r.v.sis>=140||x.r.v.dia>=90],['IMT di atas 25',x=>x.r.v.bmi>25],['Diabetes (GDP ≥126)',x=>x.r.v.gdp>=126],['Merokok atau bekas perokok',x=>x.r.v.merokok!=='Tidak'],['Aktivitas fisik ringan',x=>x.r.v.aktivitas==='Ringan'],['Usia ≥45 tahun',x=>x.r.age>=45]].map(f=>[f[0],pct(L.filter(f[1]).length,L.length)]);
  const trend=YEARS.map(y=>{const s=snap(y).filter(flt);return{y,n:s.length,hi:pct(s.filter(x=>x.r.jcs.level===2).length,s.length),nf:pct(s.filter(x=>x.r.cat>=2).length,s.length)}}).filter(p=>p.n>0);
  $('#rep').innerHTML=`
  <div class="insights">
    <div class="insight"><b>Temuan utama</b>${FIND[topF[0]]} ditemukan pada ${topF[1]}% dari ${L.length} karyawan yang punya MCU di ${S.ry}.</div>
    ${dRate?`<div class="insight"><b>Departemen prioritas</b>${dRate[0]} punya ${dRate[2]}% karyawan dengan risiko kardiovaskular tinggi (skor Jakarta ≥5).</div>`:''}
    <div class="insight"><b>MCU berulang</b>${multi} karyawan menjalani lebih dari satu MCU di ${S.ry}. Hasil terbaru yang dipakai di laporan ini.</div>
  </div>
  <div class="grid g-2-1">
    <div class="card"><div class="card-h"><h2>Kelayakan kerja per departemen</h2><span>% karyawan</span></div><div class="card-b">${stackRows(L,ds,x=>x.r.cat,CATS.map(c=>c.s),CATCOL)}</div></div>
    <div class="card"><div class="card-h"><h2>Faktor risiko Jakarta</h2><span>% karyawan</span></div><div class="card-b">${hbars(fac,100)}</div></div>
  </div>
  <div class="grid g-2">
    <div class="card"><div class="card-h"><h2>Risiko kardiovaskular per departemen</h2><span>Skor Jakarta</span></div><div class="card-b">${stackRows(L,ds,x=>x.r.jcs.level,LV.map((l,i)=>l+' '+LVR[i]),LVCOL)}</div></div>
    <div class="card"><div class="card-h"><h2>Tren per tahun</h2><span>% karyawan</span></div><div class="card-b">${lineChart(trend,[{k:'hi',c:'var(--crit)'},{k:'nf',c:'var(--warn)'}])}
      <div class="legend"><span><i style="background:var(--crit)"></i>Risiko Jakarta tinggi</span><span><i style="background:var(--warn)"></i>Dengan pembatasan / tidak fit</span></div></div></div>
  </div>
  <div class="card"><div class="card-h"><h2>Peta temuan per departemen</h2><span>% karyawan dengan temuan</span></div><div class="card-b tbl-wrap">
    <div class="heat" style="grid-template-columns:minmax(150px,1.3fr) repeat(7,minmax(0,1fr))">
      <div class="hh">Departemen</div>${Object.keys(FIND).map(k=>`<div class="hh">${FSHORT[k]}</div>`).join('')}
      ${ds.map(d=>{const g=L.filter(x=>x.e.dept===d);return`<div class="rl">${d}</div>`+Object.keys(FIND).map(k=>{const p=pct(g.filter(x=>findingsOf(x.r.v,x.e.male).includes(k)).length,g.length);return`<div class="num" style="background:color-mix(in srgb,var(--accent) ${Math.min(40,p*.9)}%,var(--surface-2))">${p}%</div>`}).join('')}).join('')}
    </div></div></div>`;
}

function paintSkj(){

  const j=jcsOf({sis:g('sis'),dia:g('dia'),bmi,gdp:g('gdp'),merokok:$('#k-mer').value,aktivitas:$('#k-act').value},g('age'),male);
  $('#k-out').innerHTML=jcsBlock(j);
}
function jcsBlock(j){
  return `<div class="live" style="margin-bottom:12px"><span>Skor total <b class="num" style="font-size:22px;margin-left:6px">${j.total}</b></span><span class="pill ${LVCLS[j.level]}">Risiko ${LV[j.level].toLowerCase()} (${LVR[j.level]})</span></div>
  <table style="min-width:0"><tbody class="num">${j.parts.map(p=>`<tr><td style="padding:8px 4px">${p.k}</td><td class="muted" style="padding:8px 4px">${p.val}</td><td align="right" style="padding:8px 4px;font-weight:700;color:${p.p>0?'var(--crit)':p.p<0?'var(--good)':'var(--muted)'}">${p.p>0?'+':''}${p.p}</td></tr>`).join('')}</tbody></table>`;
}

/* ---------- panel (drawer / modal) ---------- */
function openLayer(html,center){
  layerFocus=document.activeElement;
  $('#layer').innerHTML=`<div class="scrim ${center?'center':''}" data-close><div class="panel" role="dialog" aria-modal="true">${html}</div></div>`;
  const f=$('#layer [data-first]')||$('#layer .panel-h .icon-btn');f&&f.focus();
}
function closeLayer(){$('#layer').innerHTML='';layerFocus&&layerFocus.focus&&layerFocus.focus()}
const closeBtn=`<button class="icon-btn" data-close aria-label="Tutup">${svgi('x',16)}</button>`;
const vitCell=(label,val,unit,ref,bad)=>`<div class="${bad?'bad':''}"><span>${label}</span><b class="num">${val}</b> <small style="display:inline">${unit}</small><small>Rujukan ${ref}</small></div>`;
function openEmp(id){
  const e=EM[id],rs=e.recs;
  const trend=rs.length>=2?`<div><div class="sec-t">Tren skor Jakarta</div><div class="trend">${scoreTrend(rs)}</div><div class="legend" style="margin-top:6px"><span><i style="background:var(--good)"></i>Rendah</span><span><i style="background:var(--warn)"></i>Sedang</span><span><i style="background:var(--crit)"></i>Tinggi</span></div></div>`:'';
  const hist=rs.length?`<div><div class="sec-t">Riwayat MCU · ${rs.length} pemeriksaan</div><div class="list">${rs.map(r=>`<button class="li" data-rec="${r.id}"><div class="tx"><div class="nm num">${fmt(r.date)} <span class="tag" style="margin-left:6px">${r.jenis}</span></div><div class="sub num">${r.id} · TD ${r.v.sis}/${r.v.dia} · IMT ${r.v.bmi} · GDP ${r.v.gdp}</div></div><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">${catPill(r)}${jcsPill(r)}</div></button>`).join('')}</div></div>`
    :`<div class="note">Karyawan ini belum memiliki data MCU. Tambahkan hasil pemeriksaan pertama.</div>`;
  openLayer(`<div class="panel-h"><div class="ava" style="width:46px;height:46px;font-size:15px">${initials(e.name)}</div><div><h2>${esc(e.name)}</h2><p class="num">${e.id} · ${e.jab}</p></div>${closeBtn}</div>
  <div class="panel-b">
    <dl class="dl"><dt>Departemen</dt><dd>${e.dept}</dd><dt>Usia</dt><dd>${e.age} tahun · ${e.male?'Laki-laki':'Perempuan'}</dd><dt>Jumlah MCU</dt><dd>${rs.length} pemeriksaan${rs.length?' ('+Math.min(...rs.map(r=>r.year))+'–'+rs[0].year+')':''}</dd><dt>Status terakhir</dt><dd>${rs[0]?catPill(rs[0]):nonePill}</dd></dl>
    ${trend}${hist}</div>
  <div class="panel-f"><button class="btn pri" data-act="hasil" data-id="${e.id}">${svgi('plus',16)}Tambah hasil MCU</button></div>`);
}
function openRec(id){
  const r=MCUS.find(x=>x.id===id),e=EM[r.emp],v=r.v,f=findingsOf(v,e.male);
  openLayer(`<div class="panel-h"><div><h2 class="num">${r.id}</h2><p>${r.jenis} · ${fmt(r.date)} · ${r.klinik}</p></div>${closeBtn}</div>
  <div class="panel-b">
    <button class="li" data-emp="${e.id}" style="border:1px solid var(--line);border-radius:10px;padding:10px 12px"><div class="ava">${initials(e.name)}</div><div class="tx"><div class="nm">${esc(e.name)}</div><div class="sub">${e.dept} · ${r.age} tahun saat MCU · ${e.recs.length} MCU</div></div></button>
    <div><div class="sec-t">Parameter pemeriksaan</div><div class="vit">
      ${vitCell('Tekanan darah',v.sis+'/'+v.dia,'mmHg','<140/90',f.includes('ht'))}
      ${vitCell('Indeks massa tubuh',v.bmi,'kg/m²','18,5–26,9',f.includes('ob'))}
      ${vitCell('Gula darah puasa',v.gdp,'mg/dL','<126',f.includes('dm'))}
      ${vitCell('Kolesterol total',v.kol,'mg/dL','<240',f.includes('kol'))}
      ${vitCell('Asam urat',String(v.au).replace('.',','),'mg/dL',e.male?'≤7,0':'≤6,0',f.includes('au'))}
      ${vitCell('SGPT',v.sgpt,'U/L','≤55',f.includes('hati'))}
      ${vitCell('Visus',v.visus,'','Normal / koreksi',f.includes('mata'))}
      ${vitCell('Merokok',MEROKOK[v.merokok].split(' (')[0],'','–',false)}</div></div>
    <div><div class="sec-t">Skor Jakarta Cardiovascular</div>${jcsBlock(r.jcs)}</div>
    <div><div class="sec-t">Kesimpulan kelayakan</div><div class="note">${catPill(r)}
      ${f.length?`<ul>${f.map(k=>`<li><b style="color:var(--fg)">${FIND[k]}.</b> ${REC[k]}</li>`).join('')}</ul>`:'<p style="margin-top:8px" class="muted">Seluruh parameter dalam batas normal.</p>'}</div></div></div>
  <div class="panel-f"><button class="btn" data-act="del" data-id="${r.id}" style="margin-right:auto">Hapus data</button><button class="btn" data-close>Tutup</button></div>`);
}
function openHasil(id){
  const F=[['sis','Sistolik (mmHg)',120],['dia','Diastolik (mmHg)',80],['tb','Tinggi badan (cm)',168],['bb','Berat badan (kg)',66],['gdp','Gula darah puasa (mg/dL)',92],['kol','Kolesterol total (mg/dL)',185],['au','Asam urat (mg/dL)',5.2],['sgpt','SGPT (U/L)',28]];
  openLayer(`<div class="panel-h"><div><h2>Input hasil MCU</h2><p>Satu karyawan bisa punya banyak MCU. Data baru ditambahkan ke riwayat.</p></div>${closeBtn}</div>
  <form id="fh"><div class="panel-b"><div class="form">
   <label class="full">Karyawan<select id="h-emp" class="field" data-first>${EMP.map(e=>`<option value="${e.id}" ${e.id===id?'selected':''}>${esc(e.name)} · ${e.dept}</option>`).join('')}</select></label>
   <label>Tanggal pemeriksaan<input id="h-date" class="field" type="date" max="2026-11-20" value="2026-11-20" required></label>
   <label>Jenis MCU<select id="h-jenis" class="field">${JENIS.map(j=>`<option>${j}</option>`).join('')}</select></label>
   ${F.map(f=>`<label>${f[1]}<input id="h-${f[0]}" class="field num" type="number" step="any" min="0" value="${f[2]}" required></label>`).join('')}
   <label>Visus<select id="h-visus" class="field"><option>Normal</option><option>Miopi ringan</option><option>Miopi sedang</option></select></label>
   <label>Merokok<select id="h-mer" class="field"><option value="Tidak">Tidak merokok</option><option value="Bekas">Bekas (berhenti &lt;2 th)</option><option value="Ya">Merokok</option></select></label>
   <label>Aktivitas fisik<select id="h-act" class="field"><option>Ringan</option><option selected>Sedang</option><option>Berat</option></select></label>
   <div class="live"><span>Hasil otomatis</span><span id="h-live"></span></div></div></div>
  <div class="panel-f"><button type="button" class="btn" data-close>Batal</button><button class="btn pri" type="submit">Simpan hasil</button></div></form>`,true);
  liveHasil();
}
function readHasil(){
  const g=k=>+$('#h-'+k).value,e=EM[$('#h-emp').value],date=new Date($('#h-date').value+'T00:00:00');
  const v={sis:g('sis'),dia:g('dia'),bmi:+(g('bb')/Math.pow(g('tb')/100,2)).toFixed(1),gdp:g('gdp'),kol:g('kol'),au:g('au'),sgpt:g('sgpt'),visus:$('#h-visus').value,merokok:$('#h-mer').value,aktivitas:$('#h-act').value};
  return{v,e,date,age:e.age-(2026-date.getFullYear()),jenis:$('#h-jenis').value};
}
function liveHasil(){
  const{v,e,age}=readHasil(),c=catOf(v,e.male),j=jcsOf(v,age,e.male);
  $('#h-live').innerHTML=`<span class="pill p${c}">${CATS[c].l}</span> <span class="pill ${LVCLS[j.level]}">JCS ${j.total} · ${LV[j.level]}</span>`;
}
function openAdd(){
  openLayer(`<div class="panel-h"><div><h2>Tambah karyawan</h2><p>Data dasar. Hasil MCU diisi dari menu Data MCU.</p></div>${closeBtn}</div>
  <form id="fa"><div class="panel-b"><div class="form">
   <label class="full">Nama lengkap<input id="a-name" class="field" required placeholder="Contoh: Rahmat Hidayat" data-first></label>
   <label>Departemen<select id="a-dept" class="field">${DEPTS.map(d=>`<option>${d}</option>`).join('')}</select></label>
   <label>Jabatan<input id="a-jab" class="field" required placeholder="Contoh: Staf Gudang"></label>
   <label>Jenis kelamin<select id="a-g" class="field"><option value="L">Laki-laki</option><option value="P">Perempuan</option></select></label>
   <label>Usia<input id="a-age" class="field num" type="number" min="18" max="70" value="30" required></label></div></div>
  <div class="panel-f"><button type="button" class="btn" data-close>Batal</button><button class="btn pri" type="submit">Simpan karyawan</button></div></form>`,true);
}
function toast(t){$$('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2800)}

/* ---------- shell ---------- */
const NAV=[['Utama',[['dashboard','Dashboard','dash']]],['Data',[['karyawan','Karyawan','users'],['mcu','Data MCU','file']]],['Analisis',[['laporan','Laporan','chart'],['skor-jakarta','Skor Jakarta','heart']]]];
function paintShell(route){
  $('#nav').innerHTML=NAV.map((g,gi)=>`<div class="nav-label" style="margin-top:${gi?14:0}px">${g[0]}</div>`+g[1].map(n=>`<a href="#${n[0]}" ${route===n[0]?'aria-current="page"':''}>${svgi(n[2])}${n[1]}${n[0]==='karyawan'?`<span class="cnt num">${EMP.length}</span>`:n[0]==='mcu'?`<span class="cnt num">${MCUS.length}</span>`:''}</a>`).join('')).join('');
  const s=snap(2026).length,c=pct(s,EMP.length);
  $('#cycPct').textContent=c+'%';$('#cycBar').style.width=c+'%';
  $('#cycTxt').textContent=`${s} dari ${EMP.length} karyawan punya data MCU 2026`;
}
function route(){
  const h=location.hash.slice(1),r=VIEWS[h]?h:'dashboard';
  $('#view').innerHTML=VIEWS[r]();
  if(r==='karyawan')paintEmp();if(r==='mcu')paintMcu();if(r==='laporan')paintRep();if(r==='skor-jakarta')paintSkj();
  paintShell(r);$('#side').classList.remove('open');window.scrollTo(0,0);
}
function go(h){if(location.hash==='#'+h)route();else location.hash=h}
function repaint(){const h=location.hash.slice(1);if(h==='karyawan')paintEmp();else if(h==='mcu')paintMcu();else if(h==='laporan')paintRep();else route()}

/* ---------- event ---------- */
document.addEventListener('click',ev=>{
  const t=ev.target,c=t.closest('[data-close]');
  if(c&&(c.classList.contains('scrim')?t===c:true)){closeLayer();return}
  const a=t.closest('[data-act]');
  if(a){const k=a.dataset.act,id=a.dataset.id;
    if(k==='hasil'){closeLayer();openHasil(id)}
    else if(k==='addEmp')openAdd();
    else if(k==='export')toast('Prototipe: ekspor belum tersambung ke server');
    else if(k==='del'){
      if(!a.dataset.sure){a.dataset.sure='1';a.textContent='Klik lagi untuk menghapus';a.style.color='var(--crit)';a.style.borderColor='var(--crit)';return}
      MCUS.splice(MCUS.findIndex(r=>r.id===id),1);idx();closeLayer();route();toast('Data MCU '+id+' dihapus')}
    return}
  const g=t.closest('[data-go]');if(g){S.page=1;go(g.dataset.go);return}
  const pg=t.closest('[data-pg]');if(pg){S.page+=+pg.dataset.pg;repaint();return}
  const rc=t.closest('[data-rec]');if(rc){openRec(rc.dataset.rec);return}
  const em=t.closest('[data-emp]');if(em){openEmp(em.dataset.emp);return}
  if(t.closest('#menuBtn'))$('#side').classList.toggle('open');
  else if(!t.closest('#side'))$('#side').classList.remove('open');
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){closeLayer();$('#side').classList.remove('open')}
  if(ev.key==='Enter'&&ev.target.matches('tr.row')){const d=ev.target.dataset;d.rec?openRec(d.rec):openEmp(d.emp)}
  if(ev.key==='Enter'&&ev.target.id==='gsearch'){S.q=ev.target.value;S.dept='';S.st='';S.page=1;ev.target.value='';go('karyawan')}
});
function onFilter(ev){
  const t=ev.target,f=t.dataset.f;
  if(f){S[f]=(f==='year'||f==='ry')?+t.value:t.value;S.page=1;repaint()}
  if(t.closest('#fh'))liveHasil();
  if(t.closest('#skj'))paintSkj();
}
document.addEventListener('input',ev=>{if(ev.target.tagName==='INPUT')onFilter(ev)});
document.addEventListener('change',onFilter);
document.addEventListener('submit',ev=>{
  ev.preventDefault();const id=ev.target.id;
  if(id==='fh'){const{v,e,date,age,jenis}=readHasil();
    addRec(e,date,jenis,v,age);const r=MCUS[MCUS.length-1];r.id='MCU-'+r.year+'-'+String(MCUS.filter(x=>x.year===r.year).length+900).padStart(4,'0');
    idx();closeLayer();route();toast(e.name+' kini punya '+e.recs.length+' MCU. Hasil: '+CATS[r.cat].l)}
  if(id==='fa'){const n=EMP.length;const e={id:'KRY-'+(1001+n),name:$('#a-name').value.trim(),male:$('#a-g').value==='L',age:+$('#a-age').value,dept:$('#a-dept').value,jab:$('#a-jab').value.trim(),recs:[]};
    EMP.push(e);EM[e.id]=e;closeLayer();S.q='';S.dept='';S.st='';route();toast('Karyawan ditambahkan')}
});
window.addEventListener('hashchange',route);

/* tema */
function effTheme(){const t=document.documentElement.dataset.theme;return t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function paintTheme(){$('#themeBtn').innerHTML=svgi(effTheme()==='dark'?'sun':'moon',18)}
$('#themeBtn').onclick=()=>{const n=effTheme()==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('sehatra-theme',n)}catch(e){}paintTheme()};
try{const t=localStorage.getItem('sehatra-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
paintTheme();route();
</script>

</body></html>
